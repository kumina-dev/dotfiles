source = ~/.config/hypr/generated/hyprlock-colors.conf

general {
    hide_cursor = true
    immediate_render = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 4
    blur_size = 8
    brightness = 0.55
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    font_family = Noto Sans
    font_size = 72
    position = 0, 180
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    font_family = Noto Sans
    font_size = 18
    color = rgba(200, 200, 210, 1.0)
    position = 0, 115
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 54

    outline_thickness = 2
    outer_color = $primary
    inner_color = $surface
    font_color = $text

    rounding = 12

    placeholder_text = <span foreground="$muted">$PAMPROMPT</span>
    fail_text = <span foreground="$error">$PAMFAIL</span>

    position = 0, -30
    halign = center
    valign = center
}
