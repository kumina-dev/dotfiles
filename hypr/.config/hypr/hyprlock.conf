source = ~/.config/hypr/generated/hyprlock-colors.conf

general {
    hide_cursor = true
    immediate_render = true
    fail_timeout = 2500
}

auth {
    pam:enabled = true
    pam:module = hyprlock
}

background {
    monitor =
    path = screenshot
    blur_passes = 4
    blur_size = 8
    brightness = 0.50
}

# Clock

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"

    font_family = Noto Sans
    font_size = 72

    position = 0, 200
    halign = center
    valign = center
}

# Date

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"

    font_family = Noto Sans
    font_size = 18
    color = $muted

    position = 0, 135
    halign = center
    valign = center
}

# Authentication status.
# Display the last prompt Hyprlock exposes from PAM.
# A pam_u2f informational touch cue is not necessarily exposed here.

label {
    monitor =
    text = $PAMPROMPT

    font_family = Noto Sans
    font_size = 18
    color = $text

    position = 0, 50
    halign = center
    valign = center
}

# Password / authentication field.
# Keep this visible even while empty so the auth area never disappears.

input-field {
    monitor =

    size = 340, 54
    outline_thickness = 2

    outer_color = $primary
    inner_color = $surface
    font_color = $text

    check_color = $primary
    fail_color = $error
    fail_text = $PAMFAIL

    rounding = 12

    fade_on_empty = false
    placeholder_text = Password

    position = 0, -35
    halign = center
    valign = center
}

# Keyboard layout

label {
    monitor =
    text = $LAYOUT[FI,US]

    font_family = Noto Sans
    font_size = 12
    color = $muted

    position = 0, 28
    halign = right
    valign = bottom
}
