# KumiOS kitty configuration (Plasma).
# Colors come from the *-theme.auto.conf files next to this file, which kitty
# switches between when KumiOS/KDE changes Light/Dark. Generate them with
# python3 plasma/kitty_theme.py; do not set colors here.

font_family JetBrainsMono Nerd Font
font_size 11.0

background_opacity 0.92
window_padding_width 8
